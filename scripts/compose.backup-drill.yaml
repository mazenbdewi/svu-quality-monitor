services:
  db:
    image: mysql:8.4@sha256:da906917ca4ace3ba55538b7c2ee97a9bc865ef14a4b6920b021f0249d603f3d
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: backup_drill
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
  verifier:
    image: svu-quality-monitor-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: backup_drill
      DB_USERNAME: root
      DB_PASSWORD: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BACKUP_MINIMUM_FREE_BYTES: "0"
    tmpfs:
      - /var/www/html/storage
      - /var/backups/svu-quality-monitor
    volumes:
      - ./verify-backup-isolated.php:/var/www/html/verify-backup-isolated.php:ro
      - ../app:/var/www/html/app:ro
      - ../config:/var/www/html/config:ro
      - ../database:/var/www/html/database:ro
    command: ["php", "verify-backup-isolated.php"]
networks:
  default:
    internal: true
